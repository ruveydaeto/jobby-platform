version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: jobby_db
    environment:
      POSTGRES_USER: jobby
      POSTGRES_PASSWORD: jobby_dev_2025
      POSTGRES_DB: jobby
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobby"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
